# Install as a Home Assistant package. Both switches default OFF on first use
# and restore their previous setting afterward. See docs/Automation-Control.md.
input_boolean:
  allsky_automatic_sync:
    name: Allsky automatic NAS sync
  allsky_automatic_recovery:
    name: Allsky automatic capture recovery

input_text:
  allsky_last_recovery_capture:
    name: Allsky last recovery incident
    max: 128

command_line:
  - binary_sensor:
      name: Allsky NAS service
      unique_id: allsky_nas_service
      device_class: connectivity
      scan_interval: 300
      command_timeout: 12
      # OFF is a normal result. An offline NAS produces no command error/log.
      # This deployment uses a self-signed NAS certificate, hence this context.
      command: |
        python3 - <<'PY'
        import ssl
        from urllib.request import urlopen
        from urllib.error import URLError
        try:
            with urlopen('https://192.168.178.150:18443/indi-allsky/', timeout=5,
                         context=ssl._create_unverified_context()) as response:
                print('ON' if response.status == 200 else 'OFF')
        except (OSError, URLError):
            print('OFF')
        PY

rest_command:
  allsky_status:
    url: https://192.168.178.220/indi-allsky/automation/status
    method: GET
    headers: &allsky_headers
      Authorization: !secret allsky_automation_authorization
    # Set true after trusting the Pi certificate in HA's container.
    verify_ssl: false
    timeout: 10
  allsky_sync_start:
    url: https://192.168.178.220/indi-allsky/automation/sync/start
    method: POST
    headers: *allsky_headers
    content_type: application/json
    payload: '{{ {"request_id": request_id} | to_json }}'
    verify_ssl: false
    timeout: 10
  allsky_recovery:
    url: 'https://192.168.178.220/indi-allsky/automation/system/{{ action }}'
    method: POST
    headers: *allsky_headers
    content_type: application/json
    payload: >-
      {{ {"request_id": request_id, "require_stale": require_stale | default(true)} | to_json }}
    verify_ssl: false
    timeout: 10

automation:
  - id: allsky_nas_incremental_sync
    alias: Allsky - synchronize when NAS is available
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: /5
      - trigger: state
        entity_id: binary_sensor.allsky_nas_service
        to: 'on'
        for: '00:03:00'
      - trigger: state
        entity_id: input_boolean.allsky_automatic_sync
        to: 'on'
    conditions:
      - condition: state
        entity_id: input_boolean.allsky_automatic_sync
        state: 'on'
      - condition: state
        entity_id: device_tracker.ds1821_1
        state: home
      - condition: state
        entity_id: binary_sensor.allsky_nas_service
        state: 'on'
        for: '00:03:00'
    actions:
      - variables:
          status_reply: {}
      - action: rest_command.allsky_status
        response_variable: status_reply
        continue_on_error: true
      - condition: template
        value_template: '{{ status_reply.get("status") == 200 }}'
      - variables:
          snapshot: '{{ status_reply["content"] }}'
          sync: '{{ status_reply["content"].get("sync", {}) }}'
      - condition: template
        value_template: >-
          {{ sync.get('available', false) and not snapshot.get('maintenance', true)
             and not sync.get('active', true) and not sync.get('cancel_requested', false) }}
      - if:
          - condition: template
            value_template: >-
              {{ sync.get('state') == 'failed' and
                 (sync.get('reason') != 'connection' or sync.get('failure_streak', 0) >= 3) }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.allsky_automatic_sync
          - action: persistent_notification.create
            data:
              notification_id: allsky_sync_attention
              title: Allsky NAS sync needs attention
              message: '{{ sync.get("message", "Synchronization failed.") }} Automatic sync has been switched off.'
          - stop: Sync needs attention
      - condition: template
        value_template: >-
          {% set state = sync.get('state', 'idle') %}
          {% set age = as_timestamp(now()) - as_timestamp(sync.get('finished'), default=as_timestamp(now())) %}
          {{ state in ['idle', 'interrupted']
             or (state == 'complete' and age >= 21600)
             or (state == 'failed' and sync.get('reason') == 'connection' and age >= 1800) }}
      - action: rest_command.allsky_sync_start
        data:
          request_id: 'ha-sync-{{ as_timestamp(now()) | int }}'

  - id: allsky_coordinated_capture_recovery
    alias: Allsky - recover stalled capture gracefully
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: /1
    conditions:
      - condition: state
        entity_id: input_boolean.allsky_automatic_recovery
        state: 'on'
      - condition: template
        value_template: >-
          {% set exposure = as_timestamp(states('sensor.indi_allsky_exposure_date'), default=none) %}
          {{ exposure is not none and as_timestamp(now()) - exposure > 480 }}
    actions:
      - variables:
          status_reply: {}
      - action: rest_command.allsky_status
        response_variable: status_reply
        continue_on_error: true
      - condition: template
        value_template: >-
          {{ status_reply.get('status') == 200
             and not status_reply['content'].get('maintenance', true)
             and status_reply['content'].get('capture', {}).get('stale', false) }}
      - variables:
          before: '{{ status_reply["content"]["capture"]["last_capture"] | float }}'
          incident: '{{ status_reply["content"]["capture"]["last_capture"] | string }}'
          original_boot: '{{ status_reply["content"]["boot_id"] }}'
      - condition: template
        value_template: '{{ incident != states("input_text.allsky_last_recovery_capture") }}'
      # Persist before sending: restarting HA cannot replay the same incident.
      - action: input_text.set_value
        target:
          entity_id: input_text.allsky_last_recovery_capture
        data:
          value: '{{ incident }}'
      - variables:
          recovery_reply: {}
      - action: rest_command.allsky_recovery
        data:
          action: recover
          request_id: 'ha-recover-{{ incident }}'
        response_variable: recovery_reply
        continue_on_error: true
      - if:
          - condition: template
            value_template: '{{ recovery_reply.get("status") != 202 }}'
        then:
          - action: persistent_notification.create
            data:
              notification_id: allsky_recovery
              title: Allsky recovery could not start
              message: The Pi did not accept the recovery request. Check its API and service configuration.
          - stop: Recovery was not accepted
      - repeat:
          sequence:
            - delay: '00:01:00'
            - variables:
                status_reply: {}
            - action: rest_command.allsky_status
              response_variable: status_reply
              continue_on_error: true
          until:
            - condition: template
              value_template: >-
                {{ repeat.index >= 10 or (status_reply.get('status') == 200 and
                   status_reply['content'].get('capture', {}).get('last_capture', 0) | float(0) > before) }}
      - if:
          - condition: template
            value_template: >-
              {{ status_reply.get('status') == 200 and
                 status_reply['content'].get('capture', {}).get('last_capture', 0) | float(0) > before }}
        then:
          - action: persistent_notification.create
            data:
              notification_id: allsky_recovery
              title: Allsky capture recovered
              message: New images resumed after restarting the capture services.
          - stop: Capture recovered
      - if:
          - condition: template
            value_template: >-
              {{ status_reply.get('status') == 200
                 and not status_reply['content'].get('maintenance', true)
                 and status_reply['content'].get('capture', {}).get('recovery_allowed', false)
                 and is_state('input_boolean.allsky_automatic_recovery', 'on') }}
        then:
          - variables:
              recovery_reply: {}
          - action: rest_command.allsky_recovery
            data:
              action: reboot
              request_id: 'ha-reboot-{{ incident }}'
              # Local stalling was already verified before the restart. Its
              # failed startup may now report STOPPED instead of stale capture.
              require_stale: false
            response_variable: recovery_reply
            continue_on_error: true
          - if:
              - condition: template
                value_template: '{{ recovery_reply.get("status") == 202 }}'
            then:
              - repeat:
                  sequence:
                    - delay: '00:01:00'
                    - variables:
                        status_reply: {}
                    - action: rest_command.allsky_status
                      response_variable: status_reply
                      continue_on_error: true
                  until:
                    - condition: template
                      value_template: >-
                        {{ repeat.index >= 10 or (status_reply.get('status') == 200
                           and status_reply['content'].get('boot_id') != original_boot
                           and status_reply['content'].get('capture', {}).get('last_capture', 0) | float(0) > before) }}
      - action: persistent_notification.create
        data:
          notification_id: allsky_recovery
          title: >-
            {% set recovered = status_reply.get('status') == 200 and
               status_reply['content'].get('capture', {}).get('last_capture', 0) | float(0) > before %}
            {{ 'Allsky capture recovered' if recovered else 'Allsky recovery needs attention' }}
          message: >-
            {% set recovered = status_reply.get('status') == 200 and
               status_reply['content'].get('capture', {}).get('last_capture', 0) | float(0) > before %}
            {{ 'New images have resumed.' if recovered else
               'No new image was confirmed. No further reboot will be requested for this incident; inspect the Pi.' }}
